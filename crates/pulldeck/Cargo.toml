[package]
name = "pulldeck"
description = "KDE-friendly GitHub pull request tracker (Rust + Qt)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"

[features]
# A scripted fake server for developing the collaboration UI (see src/demo.rs, `just demo`).
# Off by default: never part of a release build.
demo = []

[dependencies]
chrono.workspace = true
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
ksni = "0.3.7"
notify-rust = "4.18.2"
pulldeck-core = { path = "../pulldeck-core", version = "0.3.0" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
cxx-qt-build.workspace = true

[lints]
workspace = true
