# git-cliff config used by release-plz. Renders Keep a Changelog sections
# (https://keepachangelog.com/en/1.1.0/) from Conventional Commits.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}]{% if release_link %}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}{% if commit.breaking %} **(breaking)**{% endif %}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
topo_order = false
sort_commits = "oldest"
commit_preprocessors = [
    # Drop the trailing "(#123)" PR reference GitHub appends on squash merge.
    { pattern = '\s*\(#\d+\)$', replace = "" },
]
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^(chore|ci|build|test|style|docs)", skip = true },
    { body = ".*security", group = "Security" },
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Changed" },
    { message = "^refactor", group = "Changed" },
    { message = "^deprecate", group = "Deprecated" },
    { message = "^(remove|revert)", group = "Removed" },
]
