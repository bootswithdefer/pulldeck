# https://release-plz.dev/docs/config
[workspace]
changelog_config = "cliff.toml"
# Binaries are shipped via GitHub releases, not crates.io.
publish = false
git_release_enable = true
git_release_type = "auto"
# One tag per release for the whole workspace: v1.2.3
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
dependencies_update = false

# The app owns the changelog and the tag; the core crate follows its version.
[[package]]
name = "pulldeck"
changelog_path = "./CHANGELOG.md"
changelog_include = ["pulldeck-core"]
git_release_enable = true
git_tag_enable = true
version_group = "pulldeck"

[[package]]
name = "pulldeck-core"
changelog_update = false
git_release_enable = false
git_tag_enable = false
version_group = "pulldeck"
