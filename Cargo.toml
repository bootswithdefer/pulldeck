[workspace]
resolver = "2"
members = ["crates/pulldeck-core", "crates/pulldeck"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/bootswithdefer/pulldeck"
authors = ["bootswithdefer"]
homepage = "https://github.com/bootswithdefer/pulldeck"
readme = "README.md"
keywords = ["github", "pull-request", "qt", "gui", "desktop"]
categories = ["development-tools", "gui"]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["full"] }
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
