name: Release binaries

# Builds the Linux binary for an existing release and attaches it.
#  - release-plz.yml calls this right after it creates a release (no PAT needed).
#  - Run it by hand to (re)build a release:  gh workflow run release.yml -f tag=v0.1.0
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach to, e.g. v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Install Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check tag matches Cargo.toml version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="pulldeck") | .version')
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match Cargo.toml version v$version" >&2
            exit 1
          fi
      - run: cargo build --release -p pulldeck
      - name: Package
        run: |
          name="pulldeck-${TAG}-x86_64-linux"
          mkdir "$name"
          cp target/release/pulldeck packaging/pulldeck.desktop packaging/pulldeck.svg LICENSE README.md "$name"/
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      # The release and its notes are created by release-plz; this only attaches the binaries.
      - name: Attach binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "pulldeck-${TAG}-x86_64-linux.tar.gz" "pulldeck-${TAG}-x86_64-linux.tar.gz.sha256" --clobber
