# https://mise.jdx.dev  —  `mise install` gives you the exact dev tools CI and the hooks use.
# Versions are pinned (and checksummed in mise.lock); `mise upgrade --bump && mise lock` to refresh.
#
# Qt 6 is a system library, not managed here: see CONTRIBUTING.md (distro packages),
# `nix develop` (flake.nix) or the dev container for a fully pinned Qt.

[settings]
lockfile = true

[tools]
rust = { version = "1.99.1", components = "rustfmt,clippy" }
just = "1.59.0"
prek = "0.5.9"
cargo-deny = "0.20.2"
git-cliff = "2.14.2"
pinact = "5.0.2"
actionlint = "1.7.12"
typos = "1.51.1"
gh = "2.103.3"
jq = "1.8.2"
uv = "0.13.6"
